
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gestion du véhicule</title>

    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/client.css}">
</head>
<body>

<div th:replace="~{fragments/client-navbar :: navbar}"></div>

<main class="container client-main">

    <div class="form-container card">

        <h1 th:text="${vehicule != null
            ? 'Modifier mon véhicule'
            : 'Ajouter un véhicule'}">
        </h1>

        <div th:if="${error}"
             class="alert alert-error"
             th:text="${error}">
        </div>

        <form method="post"
              th:action="${vehicule != null}
                ? @{/client/vehicules/{id}/modifier(id=${vehicule.id})}
                : @{/client/vehicules/ajouter}">

            <div class="form-group">
                <label for="immatriculation">
                    Immatriculation
                </label>

                <input type="text"
                       id="immatriculation"
                       name="immatriculation"
                       maxlength="30"
                       required
                       th:value="${vehicule != null
                           ? vehicule.immatriculation : ''}"
                       th:readonly="${vehicule != null}">
            </div>

            <div class="form-group">
                <label for="marque">Marque</label>

                <input type="text"
                       id="marque"
                       name="marque"
                       th:value="${vehicule != null
                           ? vehicule.marque : ''}">
            </div>

            <div class="form-group">
                <label for="modele">Modèle</label>

                <input type="text"
                       id="modele"
                       name="modele"
                       th:value="${vehicule != null
                           ? vehicule.modele : ''}">
            </div>

            <div class="form-group">
                <label for="couleur">Couleur</label>

                <input type="text"
                       id="couleur"
                       name="couleur"
                       th:value="${vehicule != null
                           ? vehicule.couleur : ''}">
            </div>

            <div class="form-actions">
                <a th:href="@{/client/vehicules}"
                   class="btn btn-outline">
                    Annuler
                </a>

                <button type="submit" class="btn btn-primary"
                        th:text="${vehicule != null
                            ? 'Enregistrer les modifications'
                            : 'Ajouter le véhicule'}">
                </button>
            </div>

        </form>
    </div>

</main>
</body>
</html>
