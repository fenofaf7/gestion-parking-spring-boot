<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des utilisateurs</title>

    <link rel="stylesheet"
          th:href="@{/css/utilisateurs.css}">
</head>

<body>

    <main class="container">

        <div class="page-header">
            <h1>Gestion des utilisateurs</h1>
            
            <a th:href="@{/admin/dashboard}" class="btn-retour">
		        ← Retour au Dashboard
		    </a>
		    <a th:href="@{/admin/utilisateurs/ajouter}"
			   class="btn-enregistrer">
			    + Ajouter un utilisateur
			</a>
        </div>
        
        <div th:if="${success}"
		     class="message message-success"
		     th:text="${success}">
		</div>
		
		<div th:if="${error}"
		     class="message message-error"
		     th:text="${error}">
		</div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Rôle</th>
                        <th>État</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="utilisateur : ${utilisateurs}">
                        <td th:text="${utilisateur.id}"></td>
                        <td th:text="${utilisateur.nom}"></td>
                        <td th:text="${utilisateur.prenom}"></td>
                        <td th:text="${utilisateur.email}"></td>
                        <td th:text="${utilisateur.telephone}"></td>

                        <td th:text="${utilisateur.role.nom}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${utilisateur.actif} ? 'badge-actif' : 'badge-inactif'"
                                  th:text="${utilisateur.actif} ? 'Actif' : 'Inactif'">
                            </span>
                        </td>
                        
                        <td class="actions">

						    <form th:if="${utilisateur.actif
							              and utilisateur.email != emailConnecte}"
							      th:action="@{/admin/utilisateurs/{id}/desactiver(id=${utilisateur.id})}"
							      method="post">
							
							    <button type="submit" class="btn-desactiver">
							        Désactiver
							    </button>
							</form>
						
						    <form th:unless="${utilisateur.actif}"
						          th:action="@{/admin/utilisateurs/{id}/activer(id=${utilisateur.id})}"
						          method="post">
						
						        <button type="submit" class="btn-activer">
						            Activer
						        </button>
						    </form>
						
						</td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(utilisateurs)}">
                        <td colspan="7" class="empty-message">
                            Aucun utilisateur enregistré.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
