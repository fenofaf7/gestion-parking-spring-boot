<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un utilisateur</title>

    <link rel="stylesheet"
          th:href="@{/css/utilisateurs.css}">
</head>
<body>

<main class="container">

    <div class="page-header">
        <h1>Ajouter un utilisateur</h1>

        <a th:href="@{/admin/utilisateurs}" class="btn-retour">
            Retour à la liste
        </a>
    </div>

    <div th:if="${error}"
         class="message message-error"
         th:text="${error}">
    </div>

    <form th:action="@{/admin/utilisateurs/ajouter}"
          method="post"
          class="user-form">

        <div class="form-group">
            <label for="nom">Nom</label>
            <input id="nom" type="text" name="nom"
                   maxlength="100" required>
        </div>

        <div class="form-group">
            <label for="prenom">Prénom</label>
            <input id="prenom" type="text" name="prenom"
                   maxlength="100" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" name="email"
                   maxlength="150" required>
        </div>

        <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input id="telephone" type="tel" name="telephone">
        </div>

        <div class="form-group">
            <label for="roleId">Rôle</label>

            <select id="roleId" name="roleId" required>
                <option value="">Sélectionner un rôle</option>

                <option th:each="role : ${roles}"
                        th:value="${role.id}"
                        th:text="${role.nom}">
                </option>
            </select>
        </div>
       
		
		<div class="form-group">
		    <label for="categorieId">Catégorie du client</label>
		
		    <select id="categorieId" name="categorieId">
		        <option value="">-- Aucune catégorie --</option>
		
		        <option th:each="categorie : ${categories}"
		                th:value="${categorie.id}"
		                th:text="${categorie.nom}">
		        </option>
		    </select>
		</div>

        <div class="form-group">
            <label for="motDePasse">Mot de passe</label>
            <input id="motDePasse"
                   type="password"
                   name="motDePasse"
                   minlength="8"
                   autocomplete="new-password"
                   required>
        </div>

        <button type="submit" class="btn-enregistrer">
            Enregistrer l'utilisateur
        </button>

    </form>

</main>

</body>
</html>
