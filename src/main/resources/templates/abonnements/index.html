
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des abonnements</title>
    <link rel="stylesheet" th:href="@{/css/abonnements.css}">
</head>
<body>

<div class="container">

    <h1>Gestion des abonnements</h1>

    <div class="actions">
        <a th:href="@{/admin/dashboard}" class="btn secondary">
            Tableau de bord
        </a>

        <a th:href="@{/admin/abonnements/ajouter}" class="btn">
            + Nouvel abonnement
        </a>
    </div>

    <p class="success" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Client</th>
                    <th>Formule</th>
                    <th>Début</th>
                    <th>Fin</th>
                    <th>Prix</th>
                    <th>Statut</th>
                    <th>Place</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="abonnement : ${abonnements}">

                    <td th:text="${abonnement.id}"></td>

                    <td th:text="${abonnement.utilisateur.nom
                        + ' ' + abonnement.utilisateur.prenom}"></td>

                    <td th:text="${abonnement.type.nom}"></td>

                    <td th:text="${#temporals.format(
                        abonnement.dateDebut, 'dd/MM/yyyy')}"></td>

                    <td th:text="${#temporals.format(
                        abonnement.dateFin, 'dd/MM/yyyy')}"></td>

                    <td th:text="${abonnement.prix + ' Ar'}"></td>

                    <td th:text="${abonnement.statut}"></td>
                    
                    <td th:text="${abonnement.place != null
					    ? abonnement.place.numero
					    : 'Non attribuée'}"></td>

                    <td>
                        <div class="row-actions">

                            <form th:if="${abonnement.statut.name() != 'ANNULE'}"
                                  th:action="@{/admin/abonnements/{id}/renouveler(id=${abonnement.id})}"
                                  method="post"
                                  onsubmit="return confirm('Renouveler cet abonnement ?')">

                                <button type="submit" class="btn">
                                    Renouveler
                                </button>
                            </form>

                            <form th:if="${abonnement.statut.name() != 'ANNULE'}"
                                  th:action="@{/admin/abonnements/{id}/annuler(id=${abonnement.id})}"
                                  method="post"
                                  onsubmit="return confirm('Annuler cet abonnement ?')">

                                <button type="submit" class="btn danger">
                                    Annuler
                                </button>
                            </form>

                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(abonnements)}">
                    <td colspan="9">Aucun abonnement enregistré.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
